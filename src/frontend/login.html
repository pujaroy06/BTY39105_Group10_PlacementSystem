{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="card" style="max-width: 420px; margin: 2rem auto;">
    <h2>Login</h2>
    <p style="color: var(--color-muted); font-size: 0.9rem;">
        Students: use your registered email. Admin: use the placement officer account.
    </p>

    <form method="POST" action="{{ url_for('auth_routes.login_page') }}">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Login</button>
    </form>

    <p style="margin-top: 1rem; font-size: 0.9rem;">
        New student?
        <a href="{{ url_for('auth_routes.register_page') }}">Register here</a>
    </p>
</div>
{% endblock %}
