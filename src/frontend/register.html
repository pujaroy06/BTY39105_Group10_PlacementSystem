{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="card" style="max-width: 480px; margin: 2rem auto;">
    <h2>Student Registration</h2>

    <form method="POST" action="{{ url_for('auth_routes.register_page') }}">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="phone">Phone</label>
        <input type="text" id="phone" name="phone">

        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" name="dob">

        <label for="program_id">Program / Branch</label>
        <select id="program_id" name="program_id" required>
            <option value="">-- Select your program --</option>
            {% for program in programs %}
                <option value="{{ program.program_id }}">{{ program.program_name }}</option>
            {% endfor %}
        </select>

        <label for="enrollment_year">Enrollment Year</label>
        <input type="number" id="enrollment_year" name="enrollment_year" min="2018" max="2030" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Register</button>
    </form>

    <p style="margin-top: 1rem; font-size: 0.9rem;">
        Already have an account?
        <a href="{{ url_for('auth_routes.login_page') }}">Login here</a>
    </p>
</div>
{% endblock %}
